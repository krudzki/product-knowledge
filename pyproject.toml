[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-knowledge"
version = "0.1.0"
description = "Canonical product knowledge: identity, observations, and price estimates"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "structlog>=24.4,<26.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
    "product-matching @ git+https://github.com/krudzki/product-matching.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["product_knowledge"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
